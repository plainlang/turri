<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -5 1100 490" width="1100" height="490" role="img" aria-labelledby="d-title d-desc">
      <title id="d-title">How turri works</title>
      <desc id="d-desc">You describe changes to turri; turri asks and reports back. turri writes the ***plain specs, which you read and review with turri. Then turri loops without end: it reads the specs, regenerates the code from them, and tests the code against them.</desc>
      <style>
@font-face { font-family: "Archivo"; font-weight: 900; src: url(data:font/woff2;base64,) format("woff2"); }
@font-face { font-family: "Archivo"; font-weight: 800; src: url(data:font/woff2;base64,) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(data:font/woff2;base64,) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(data:font/woff2;base64,) format("woff2"); }
text { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
.lbl { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 500; fill: #0f0f0f; }
.node { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 22px; }
.sub { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; }
.flow { fill: none; stroke: #0f0f0f; stroke-width: 2.25; stroke-linecap: round; }
.review { stroke-dasharray: 9 7; }
@media (prefers-reduced-motion: no-preference) {
  .spin { transform-box: fill-box; transform-origin: 50% 58%; animation: turn 6s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
}
</style>
      <rect x="16" y="-5" width="1100" height="490" rx="18" fill="#e0ff6e"/>
      <defs>
        <marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#0f0f0f"/>
        </marker>
      </defs>
      <path class="flow review" d="M120 142 V 70 Q 120 40 150 40 H 955 Q 985 40 985 70 V 158"/>
      <text class="lbl" x="552" y="28" text-anchor="middle">review loop</text>
      <path class="flow" d="M174.4 180 L 474.8 180" marker-end="url(#head)"/>
      <text class="lbl" x="324" y="166" text-anchor="middle">describe changes</text>
      <path class="flow" d="M474.8 220 L 174.4 220" marker-end="url(#head)"/>
      <text class="lbl" x="324" y="246" text-anchor="middle">asks · reports</text>
      <path class="flow" d="M641.2 180 L 900 180" marker-end="url(#head)"/>
      <text class="lbl" x="771" y="166" text-anchor="middle">writes</text>
      <path class="flow" d="M900 220 L 641.2 220" marker-end="url(#head)"/>
      <text class="lbl" x="771" y="246" text-anchor="middle">reads</text>
      <path class="flow" d="M538 244 L 538 380" marker-end="url(#head)"/>
      <text class="lbl" x="524" y="318" text-anchor="end">regenerates</text>
      <path class="flow" d="M578 380 L 578 244" marker-end="url(#head)"/>
      <text class="lbl" x="592" y="318" text-anchor="start">tests against ***plain</text>
      <text class="spin" x="880" y="372" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="900" font-size="44" fill="#0f0f0f">↻</text>
      <circle cx="120" cy="200" r="58" fill="none" stroke="#0f0f0f" stroke-width="2.5"/>
      <text class="node" x="120" y="208" text-anchor="middle" fill="#0f0f0f">you</text>
      <rect x="470" y="156" width="176" height="88" rx="44" fill="#0f0f0f"/>
      <text x="558" y="212" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="900" font-size="34" letter-spacing="-1" fill="#e0ff6e">turri</text>
      <rect x="900" y="158" width="170" height="84" rx="6" fill="#223936"/>
      <text x="985" y="208" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700" font-size="24" fill="#c5dcd9">***plain</text>
      <rect x="473" y="380" width="170" height="84" rx="6" fill="#e0ff6e" stroke="#0f0f0f" stroke-width="2.5" stroke-dasharray="7 6"/>
      <text class="node" x="558" y="420" text-anchor="middle" fill="#0f0f0f">code</text>
      <text class="sub" x="558" y="444" text-anchor="middle" fill="#0f0f0f">DISPOSABLE</text>
    </svg>
