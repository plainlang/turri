name: publish

# This workflow owns both paths onto npm:
#
#   * A published GitHub Release tagged `vX.Y.Z` ships that version to the
#     `latest` dist-tag. The tag is the source of truth for the version -
#     nothing is committed back to the repository.
#   * A push or merge into main ships a prerelease to the `next` dist-tag,
#     versioned from the current `latest` plus the commit sha. `latest` is never
#     touched by this path, so `npm install -g @turri-dev/cli` never gets a
#     prerelease.
#
# Auth is OIDC (npm trusted publishing) - no NPM_TOKEN secret. The trusted
# publisher is configured on npmjs.com against this repo and this exact
# workflow filename (publish.yml), which is why the prerelease job lives here
# rather than in a file of its own: a new filename would not be trusted and
# would need a second publisher entry on npmjs.com.
on:
  release:
    types: [published]
  push:
    branches: [main]

# Least privilege by default: jobs get no GITHUB_TOKEN scopes unless they
# opt in below.
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  PACKAGE: "@turri-dev/cli"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release builds from its tag; a push builds from its commit.
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # ---------------------------------------------------------------------------
  # Published GitHub Release -> the `latest` dist-tag.
  publish:
    name: Publish to npm
    needs: test
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    # Records the release under Deployments -> npm.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@turri-dev/cli
    permissions:
      contents: read       # read the tagged tree
      id-token: write      # OIDC token for trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24      # trusted publishing needs >= 22.14
          cache: npm

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # The package runs dist/, built by prepack, never src/ - prove it is packed.
      - name: Check the built CLI is in the package
        run: |
          npm pack --dry-run --json \
            | jq -e '[.[]][0].files[] | select(.path == "dist/cli.js")' >/dev/null \
            || { echo "::error::dist/cli.js is missing from the npm package"; exit 1; }

      - name: Read the version from the release tag
        id: pkg
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a semver release tag (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse if this version is already on npm
        run: |
          if npm view "$PACKAGE@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::$PACKAGE@${{ steps.pkg.outputs.version }} is already published - tag a new version"
            exit 1
          fi

      # The tag decides the version, so it is applied here in the runner only
      # and never committed back to the repository.
      - name: Set the package version to match the tag
        run: npm version "${{ steps.pkg.outputs.version }}" --no-git-tag-version --allow-same-version

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived npm token. Provenance is attached automatically.
      # A release marked as a pre-release goes out under `next`, so `latest`
      # stays stable.
      - name: Publish
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

  # ---------------------------------------------------------------------------
  # Push or merge into main -> a prerelease on the `next` dist-tag.
  #
  # Runs in this file, not a file of its own, because npm's trusted publisher is
  # bound to this exact filename. See the header comment.
  prerelease:
    name: Publish prerelease to npm
    needs: test
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # The same environment the release path uses, so OIDC sees identical claims
    # whether or not the trusted publisher pins an environment. It carries no
    # protection rules, so this never waits for an approval.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@turri-dev/cli/v/next
    permissions:
      contents: read
      id-token: write      # OIDC token for trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24      # trusted publishing needs >= 22.14
          cache: npm

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Check the built CLI is in the package
        run: |
          npm pack --dry-run --json \
            | jq -e '[.[]][0].files[] | select(.path == "dist/cli.js")' >/dev/null \
            || { echo "::error::dist/cli.js is missing from the npm package"; exit 1; }

      # package.json on main is stale by design, so the published `latest` is
      # the base - or package.json's version before the first release. Bump its
      # patch and append the commit sha: the prerelease therefore sits below the
      # release it anticipates, and names the commit it was built from.
      - name: Derive the prerelease version
        id: pre
        run: |
          BASE="$(npm view "$PACKAGE" dist-tags.latest 2>/dev/null || true)"
          if [ -z "$BASE" ]; then
            BASE="$(node -p 'require("./package.json").version')"
            echo "no latest on npm yet - building on package.json's $BASE"
          fi
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the base version is '$BASE', which is not a plain X.Y.Z release - refusing to guess the next version"
            exit 1
          fi
          MAJOR="${BASE%%.*}"
          REST="${BASE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST##*.}"
          VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-next.${GITHUB_SHA:0:7}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest is $BASE - publishing $VERSION"

      # A re-run of the same commit derives the same version, and npm refuses to
      # overwrite. Detect that and no-op instead of failing the run red.
      - name: Skip if this commit was already published
        id: guard
        run: |
          if npm view "$PACKAGE@${{ steps.pre.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::$PACKAGE@${{ steps.pre.outputs.version }} is already on npm - nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Applied in the runner only, never committed back - same as the release
      # path.
      - name: Set the package version
        if: ${{ steps.guard.outputs.skip == 'false' }}
        run: npm version "${{ steps.pre.outputs.version }}" --no-git-tag-version --allow-same-version

      # `--tag next` is what keeps `latest` stable: without it npm would point
      # `latest` at this prerelease and every install would get it.
      - name: Publish under the `next` dist-tag
        if: ${{ steps.guard.outputs.skip == 'false' }}
        run: npm publish --access public --tag next

      - name: Summarize
        if: ${{ steps.guard.outputs.skip == 'false' }}
        run: |
          {
            echo "### Prerelease published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${{ steps.pre.outputs.version }}\` |"
            echo "| dist-tag | \`next\` |"
            echo "| \`latest\` still | \`${{ steps.pre.outputs.base }}\` |"
            echo
            echo "Try it: \`npm install -g $PACKAGE@next\`"
          } >> "$GITHUB_STEP_SUMMARY"
